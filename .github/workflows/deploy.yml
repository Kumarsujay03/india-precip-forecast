name: Fetch forecast and deploy

on:
  schedule:
    # 00 UTC run is fully published (240 h) by ~08:00 UTC; run daily at 09:30 UTC (15:00 IST).
    - cron: "30 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:   # PRs run tests + build only; deploy is skipped

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (de-accumulation, units)
        run: pytest -q

      - name: Fetch latest complete IFS run (falls back to previous run)
        run: python fetch.py --out-dir data

      - name: Process into site data
        run: |
          python process.py --data-dir data --out-dir site/data
          cat site/data/meta.json | head -c 200; echo
          ls -la site/data

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Runs only if build succeeded; on failure the previous deployment (last good data) stays live.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
