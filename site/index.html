<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>India Rain Forecast</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>India Rain Forecast</h1>
    <span id="run">Loading forecast…</span>
  </header>

  <main id="stage">
    <div id="map"></div>
    <aside id="point" hidden aria-live="polite">
      <div class="pt-head">
        <span id="pt-title">–</span>
        <button id="pt-close" type="button" aria-label="Close">×</button>
      </div>
      <p id="pt-dry"></p>
      <div id="pt-stats"></div>
      <div class="pt-chart"><canvas id="pt-chart"></canvas></div>
      <p class="pt-note">Nearest 0.25° grid cell · "dry" = below 0.1 mm/h for 6 h or more · shaded: dry window</p>
    </aside>
    <div id="hint">Click the map for a point forecast</div>
  </main>

  <section id="controls">
    <div id="when"><span id="valid">–</span> <span id="lead" class="dim"></span></div>
    <div id="timeline">
      <button id="play" type="button" aria-label="Play"><span></span></button>
      <div id="track">
        <input id="slider" type="range" min="0" max="0" value="0" step="1" aria-label="Forecast time">
        <div id="ticks"></div>
      </div>
    </div>
    <div id="legend"></div>
  </section>

  <footer>
    Forecast data: <a href="https://www.ecmwf.int/en/forecasts/datasets/open-data">ECMWF IFS open data</a>,
    © ECMWF, licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
    Processed (cropped, de-accumulated) for this site.
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="dry.js"></script>
  <script src="point.js"></script>
  <script src="app.js"></script>
</body>
</html>
